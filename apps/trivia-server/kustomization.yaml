apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trivia
resources:
  - deployment.yaml
  - service.yaml
images:
  # The CI of trivia-server replaces newTag with the commit it just built (kustomize edit set image),
  # and Argo CD rolls the new version out.
  - name: ghcr.io/jucollet/trivia-server
    newTag: latest
