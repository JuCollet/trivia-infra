apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivia-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JuCollet/trivia-infra.git
    targetRevision: master
    path: apps/trivia-server
  destination:
    server: https://kubernetes.default.svc
    namespace: trivia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
